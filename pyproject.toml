[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotrace"
version = "0.1.4"
description = "Source-verifiable geo-temporal media discovery"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PySide6>=6.7,<7", "tzdata>=2024.1", "tzfpy>=2.1.2,<3", "reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
audit = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]
build = ["pyinstaller>=6,<7"]
analysis = ["Pillow>=10", "ImageHash>=4"]

[project.scripts]
geotrace = "geotrace.app:main"
geotrace-cli = "geotrace.cli:main"

[tool.setuptools.packages.find]
include = ["geotrace*"]
